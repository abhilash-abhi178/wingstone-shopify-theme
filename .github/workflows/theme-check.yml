name: Theme Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  theme-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'

      - name: Install theme-check
        run: gem install theme-check

      - name: Run theme-check
        run: theme-check